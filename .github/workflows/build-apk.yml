name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: 'stable'

      - name: Regenerate folder android dari template resmi Flutter
        run: |
          rm -rf android
          flutter create --platforms=android --org com.nikodwidharma --project-name offline_music_player .

      - name: Tambahkan permission yang dibutuhkan (audio, internet, background playback)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />#' "$MANIFEST"
          sed -i 's/android:label="offline_music_player"/android:label="Swara"/' "$MANIFEST"
          cat "$MANIFEST"

      - name: Buat ikon status bar notifikasi (wajib monokrom/siluet)
        run: |
          cat > android/app/src/main/res/drawable/ic_stat_swara.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF" android:pathData="M12,3v10.55c-0.59,-0.34 -1.27,-0.55 -2,-0.55c-2.21,0 -4,1.79 -4,4s1.79,4 4,4s4,-1.79 4,-4L14,7h4L18,3z"/>
          </vector>
          EOF

      - name: Buat ikon tombol notifikasi (play, pause, next, previous)
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_notif_play.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF" android:pathData="M8,5v14l11,-7z"/>
          </vector>
          EOF
          cat > android/app/src/main/res/drawable/ic_notif_pause.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF" android:pathData="M6,19h4L10,5L6,5v14zM14,5v14h4L18,5h-4z"/>
          </vector>
          EOF
          cat > android/app/src/main/res/drawable/ic_notif_next.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF" android:pathData="M6,18l8.5,-6L6,6v12zM16,6v12h2L18,6h-2z"/>
          </vector>
          EOF
          cat > android/app/src/main/res/drawable/ic_notif_previous.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF" android:pathData="M6,6h2v12L6,18L6,6zM9.5,12l8.5,6L18,6z"/>
          </vector>
          EOF

      - name: Install dependency
        run: flutter pub get

      - name: Patch namespace untuk plugin lama yang belum kompatibel AGP terbaru
        # on_audio_query dan plugin Flutter lama lainnya tidak punya 'namespace' di build.gradle mereka.
        # AGP 8+ mewajibkan namespace — tanpanya build langsung gagal.
        #
        # Cara yang benar untuk AGP 8+ (bukan afterEvaluate yang sudah deprecated):
        # Inject blok Groovy ke masing-masing build.gradle plugin LEWAT gradle init script.
        # Gradle init script (.gradle) dieksekusi sebelum project dievaluasi, jadi
        # 'beforeEvaluate' dan 'afterEvaluate' masih valid di sini.
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/fix-namespace.gradle" << 'GROOVY'
          // Init script: dijalankan oleh Gradle sebelum project manapun dievaluasi.
          // Tujuan: inject 'namespace' ke plugin Flutter lama yang belum punya (AGP 8+ requirement).
          allprojects {
              buildscript {}
              afterEvaluate {
                  if (it.hasProperty('android')) {
                      def android = it.extensions.findByName('android')
                      if (android != null) {
                          try {
                              if (android.namespace == null || android.namespace.isEmpty()) {
                                  android.namespace = it.group?.toString() ?: it.name
                              }
                          } catch (ignored) {}
                          try {
                              android.compileOptions {
                                  sourceCompatibility JavaVersion.VERSION_17
                                  targetCompatibility JavaVersion.VERSION_17
                              }
                          } catch (ignored) {}
                      }
                  }
              }
          }
          GROOVY
          echo "Init script dibuat:"
          cat "$HOME/.gradle/init.d/fix-namespace.gradle"

      - name: Aktifkan core library desugaring di app/build.gradle.kts
        # flutter_local_notifications (dan beberapa plugin lain) butuh isCoreLibraryDesugaringEnabled = true
        # di level :app — ini TIDAK bisa diset lewat init script (hanya berlaku per-module),
        # harus langsung di-patch ke android/app/build.gradle.kts.
        run: |
          APP_GRADLE="android/app/build.gradle.kts"

          # 1. Aktifkan isCoreLibraryDesugaringEnabled di compileOptions
          #    Kotlin DSL template dari flutter create sudah punya blok compileOptions,
          #    cukup tambahkan satu baris di dalamnya.
          if grep -q "isCoreLibraryDesugaringEnabled" "$APP_GRADLE"; then
            sed -i 's/isCoreLibraryDesugaringEnabled\s*=\s*false/isCoreLibraryDesugaringEnabled = true/' "$APP_GRADLE"
          else
            # Sisipkan setelah baris sourceCompatibility (paling aman, pasti ada di template)
            sed -i '/sourceCompatibility/a\        isCoreLibraryDesugaringEnabled = true' "$APP_GRADLE"
          fi

          # 2. Tambahkan desugar dependency
          #    Pakai append ke akhir file — lebih reliable daripada sed cari blok dependencies {}
          #    karena format/indentasi Kotlin DSL bisa bervariasi antar versi Flutter.
          #    Gradle akan merge blok dependencies {} yang muncul beberapa kali di file yang sama.
          if ! grep -q "desugar_jdk_libs" "$APP_GRADLE"; then
            cat >> "$APP_GRADLE" << 'EOF'

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          EOF
          fi

          # 3. multiDexEnabled
          if ! grep -q "multiDexEnabled" "$APP_GRADLE"; then
            sed -i '/minSdk/a\        multiDexEnabled = true' "$APP_GRADLE"
          fi

          echo "=== app/build.gradle.kts setelah patch ==="
          cat "$APP_GRADLE"

      - name: Build APK
        run: flutter build apk --release
        continue-on-error: true

      - name: Cari file APK di manapun lokasinya
        run: |
          mkdir -p build/app/outputs/flutter-apk
          FOUND=$(find . -name "app-release.apk" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$FOUND" ]; then
            echo "APK tidak ditemukan, menampilkan semua file .apk yang ada:"
            find . -name "*.apk"
            exit 1
          fi
          echo "APK ditemukan di: $FOUND"
          cp "$FOUND" build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
