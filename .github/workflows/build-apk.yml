name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'

      - name: Regenerate android folder from official Flutter template
        run: |
          rm -rf android
          flutter create --platforms=android --org com.nikodwidharma --project-name offline_music_player .

      - name: Add required permissions (audio, internet, background playback)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />#' "$MANIFEST"
          sed -i 's/android:label="offline_music_player"/android:label="Swara"/' "$MANIFEST"
          cat "$MANIFEST"

      - name: Declare audio_service service explicitly (required on Android 14+/API 34+)
        # Without foregroundServiceType="mediaPlayback" declared explicitly here,
        # the audio_service service silently fails to start on Android 14 and above -
        # as a result neither the music control notification nor the lockscreen appears,
        # with no visible error. android:exported is also mandatory since Android 12
        # for components that have an intent-filter.
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's#</application>#    <service\n        android:name="com.ryanheise.audioservice.AudioService"\n        android:foregroundServiceType="mediaPlayback"\n        android:exported="true">\n        <intent-filter>\n            <action android:name="android.media.browse.MediaBrowserService" />\n        </intent-filter>\n    </service>\n    <receiver\n        android:name="com.ryanheise.audioservice.MediaButtonReceiver"\n        android:exported="true">\n        <intent-filter>\n            <action android:name="android.intent.action.MEDIA_BUTTON" />\n        </intent-filter>\n    </receiver>\n</application>#' "$MANIFEST"
          cat "$MANIFEST"

      - name: Change MainActivity.kt to extend AudioServiceFragmentActivity
        # Plain AudioServiceActivity was reported to cause a "Flutter JNI error" crash
        # right after the notification is created, on some devices (especially custom
        # ROM/skins such as XOS, MIUI, etc). AudioServiceFragmentActivity is the more
        # stable variant based on FlutterFragmentActivity, used here to avoid
        # that bug. Reference: github.com/ryanheise/audio_service/pull/840
        run: |
          MAINACTIVITY=$(find android/app/src/main/kotlin -name "MainActivity.kt")
          echo "Found at: $MAINACTIVITY"
          sed -i 's/import io.flutter.embedding.android.FlutterActivity/import com.ryanheise.audioservice.AudioServiceFragmentActivity/' "$MAINACTIVITY"
          sed -i 's/import com.ryanheise.audioservice.AudioServiceActivity/import com.ryanheise.audioservice.AudioServiceFragmentActivity/' "$MAINACTIVITY"
          sed -i 's/FlutterActivity()/AudioServiceFragmentActivity()/' "$MAINACTIVITY"
          sed -i 's/AudioServiceActivity()/AudioServiceFragmentActivity()/' "$MAINACTIVITY"
          cat "$MAINACTIVITY"

      - name: Copy status bar icon and notification buttons from repo (do not regenerate every build)
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp android_res_extra/ic_stat_swara.xml android/app/src/main/res/drawable/ic_stat_swara.xml
          cp android_res_extra/ic_notif_shuffle.xml android/app/src/main/res/drawable/ic_notif_shuffle.xml
          cp android_res_extra/ic_notif_repeat.xml android/app/src/main/res/drawable/ic_notif_repeat.xml
          echo "=== drawable folder contents after copy ==="
          ls -la android/app/src/main/res/drawable/

      - name: Keep custom icons from R8 resource shrinker
        # This is the actual root cause of the "Invalid notification (no valid small icon)" crash.
        # Officially documented in the audio_service README: the plugin built-in icons survive R8,
        # but our custom icon (ic_stat_swara) gets removed by shrinking unless
        # excluded manually via res/raw/keep.xml. The file exists in source but is missing in the final APK.
        run: |
          mkdir -p android/app/src/main/res/raw
          cat > android/app/src/main/res/raw/keep.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources xmlns:tools="http://schemas.android.com/tools" tools:keep="@drawable/ic_stat_swara,@drawable/ic_notif_shuffle,@drawable/ic_notif_repeat" />
          EOF
          cat android/app/src/main/res/raw/keep.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Patch namespace for legacy plugins incompatible with latest AGP
        # on_audio_query and other legacy Flutter plugins have no 'namespace' in their build.gradle.
        # AGP 8+ requires a namespace - without it the build fails immediately.
        #
        # The correct approach for AGP 8+ (not the deprecated afterEvaluate):
        # Inject a Groovy block into each plugin build.gradle VIA a Gradle init script.
        # A Gradle init script (.gradle) runs before any project is evaluated, so
        # 'beforeEvaluate' and 'afterEvaluate' are still valid here.
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/fix-namespace.gradle" << 'GROOVY'
          // Init script: executed by Gradle before any project is evaluated.
          // Purpose: inject 'namespace' into legacy Flutter plugins missing it (AGP 8+ requirement).
          allprojects {
              buildscript {}
              afterEvaluate {
                  if (it.hasProperty('android')) {
                      def android = it.extensions.findByName('android')
                      if (android != null) {
                          try {
                              if (android.namespace == null || android.namespace.isEmpty()) {
                                  android.namespace = it.group?.toString() ?: it.name
                              }
                          } catch (ignored) {}
                          try {
                              // Force compileSdk 36 (match the app) so the AAR metadata
                              // check does not fail: legacy plugin (on_audio_query) uses compileSdk 33
                              // while androidx requires at least 34.
                              android.compileSdk = 36
                          } catch (ignored) {}
                          try {
                              android.compileSdkVersion = 36
                          } catch (ignored) {}
                          try {
                              android.compileOptions {
                                  sourceCompatibility JavaVersion.VERSION_17
                                  targetCompatibility JavaVersion.VERSION_17
                              }
                          } catch (ignored) {}
                      }
                  }
              }
          }
          GROOVY
          echo "Init script created:"
          cat "$HOME/.gradle/init.d/fix-namespace.gradle"

      - name: Switch LaunchTheme/NormalTheme to Theme.AppCompat descendants
        # AudioServiceFragmentActivity extends FlutterFragmentActivity, and that REQUIRES
        # a Theme.AppCompat descendant theme. The default 'flutter create' theme is still a plain Android theme
        # (Theme.Light/Black.NoTitleBar); without this the activity crashes:
        # "IllegalStateException: You need to use a Theme.AppCompat theme (or descendant)
        # with this activity" - exactly why music keeps playing (service survives) while
        # the screen force closes (the activity crashes).
        run: |
          STYLES="android/app/src/main/res/values/styles.xml"
          STYLES_NIGHT="android/app/src/main/res/values-night/styles.xml"
          sed -i 's#@android:style/Theme.Light.NoTitleBar#Theme.AppCompat.Light.NoActionBar#g' "$STYLES"
          sed -i 's#@android:style/Theme.Black.NoTitleBar#Theme.AppCompat.NoActionBar#g' "$STYLES_NIGHT"
          echo "=== styles.xml ==="
          cat "$STYLES"
          echo "=== styles.xml (night) ==="
          cat "$STYLES_NIGHT"

      - name: Enable core library desugaring in app/build.gradle.kts
        # flutter_local_notifications requires isCoreLibraryDesugaringEnabled = true in :app.
        # Kotlin jvmTarget must also be aligned to 17 to match Java (not 11 vs 17).
        run: |
          APP_GRADLE="android/app/build.gradle.kts"

          # 1. Enable isCoreLibraryDesugaringEnabled in compileOptions
          if grep -q "isCoreLibraryDesugaringEnabled" "$APP_GRADLE"; then
            sed -i 's/isCoreLibraryDesugaringEnabled\s*=\s*false/isCoreLibraryDesugaringEnabled = true/' "$APP_GRADLE"
          else
            sed -i '/sourceCompatibility/a\        isCoreLibraryDesugaringEnabled = true' "$APP_GRADLE"
          fi

          # 2. multiDexEnabled
          if ! grep -q "multiDexEnabled" "$APP_GRADLE"; then
            sed -i '/minSdk/a\        multiDexEnabled = true' "$APP_GRADLE"
          fi

          # 3. Append desugar dependency at the end of the file.
          #    Gradle merges multiple dependencies{} blocks automatically.
          #
          #    NOTE: do not append a kotlinOptions/jvmTarget block here - on
          #    AGP 9 + Kotlin 2.x that is a script-compilation ERROR. The Flutter
          #    3.47 template already sets the JVM target itself via `kotlin { compilerOptions }`.
          cat >> "$APP_GRADLE" << 'GRADLEOF'

          // === Patched by CI: desugar ===
          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
              // Required for the Theme.AppCompat.* theme resources in styles.xml (used by
              // AudioServiceFragmentActivity, see the "Switch LaunchTheme/NormalTheme" step)
              implementation("androidx.appcompat:appcompat:1.7.0")
          }
          GRADLEOF

          echo "=== app/build.gradle.kts after patch ==="
          cat "$APP_GRADLE"

      - name: Trim unused language resources (keep en and in only)
        run: |
          APP_GRADLE="android/app/build.gradle.kts"
          if ! grep -q 'resConfigs("en", "in")' "$APP_GRADLE"; then
            sed -i '/targetSdk/a\        resConfigs("en", "in")' "$APP_GRADLE"
          fi
          cat "$APP_GRADLE"

      - name: Enable shrinkResources in release build
        run: |
          APP_GRADLE="android/app/build.gradle.kts"
          if ! grep -q "shrinkResources" "$APP_GRADLE"; then
            sed -i '/signingConfig = signingConfigs.getByName("debug")/a\            shrinkResources = true' "$APP_GRADLE"
          fi
          cat "$APP_GRADLE"

      - name: Build APK
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols

      - name: Verify split APK outputs exist
        run: |
          rm -f build/app/outputs/flutter-apk/*x86_64*.apk
          DEST="build/app/outputs/flutter-apk"
          echo "=== APK outputs in $DEST ==="
          ls -la "$DEST"
          COUNT=$(ls "$DEST"/app-*-release.apk 2>/dev/null | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "No app-*-release.apk found in $DEST"
            exit 1
          fi
          echo "Found $COUNT split APK(s)."

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-app-apks
          path: build/app/outputs/flutter-apk/*.apk
